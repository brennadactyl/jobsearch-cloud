# The repo's first CI. It runs checks, not builds-for-deploy: deploys stay
# manual, from a main checkout, through each package's own npm script (see
# .claude/skills/verify-and-deploy/SKILL.md).
#
# Only client-react/ is covered. client/ and server/ deliberately carry no
# unit tests - client/ is a single no-build file that may yet be retired
# (docs/react-adoption-plan.md), and server/'s checks are verify-local.mjs,
# which needs a running `wrangler dev --local` with D1 migrations applied.
# Adding that as a second job is worth doing and is independent of this one;
# it would need its wrangler version pinned here, since this repo commits no
# lockfile for server/.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-react/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails
      # if package.json has drifted from it, which is the whole reason that
      # lockfile is committed (see .gitignore).
      #
      # --ignore-scripts because nothing here needs a postinstall: esbuild and
      # workerd ship their platform binaries as optional dependencies, and npm
      # 11 gates their install scripts anyway. Verified locally - the build and
      # wrangler both work without them.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the bundle builds, and with it that the guard in vite.config.ts
      # is satisfied by a real value rather than only failing without one. The
      # URL is a placeholder: nothing is deployed from CI, and the build must
      # not depend on a secret to be verifiable on a fork.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://example.invalid
