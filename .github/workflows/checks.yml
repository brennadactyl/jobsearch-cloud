# Checks only. Deploys stay manual, from a main checkout, through each
# package's own npm script (.claude/skills/verify-and-deploy/SKILL.md).
#
# client-react/ is covered in full. Of server/, only verify-schema-doc.mjs runs
# here: verify-local.mjs needs a running `wrangler dev --local`, and server/
# commits no lockfile to pin wrangler with.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-react/package-lock.json

      # `ci`: install exactly the committed lockfile, and fail if package.json
      # has drifted from it.
      #
      # --ignore-scripts: esbuild and workerd ship their platform binaries as
      # optional dependencies, so nothing here needs a postinstall.
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the bundle builds, and with it that the guard in vite.config.ts
      # is satisfied by a real value rather than only failing without one. The
      # URL is a placeholder: nothing is deployed from CI, and the build must
      # not depend on a secret to be verifiable on a fork.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://example.invalid

  # Fails when docs/schema.md no longer matches what server/migrations/ builds.
  # Plain Node and in-process SQLite, so there is nothing to install.
  schema-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: docs/schema.md matches the migrations
        run: node server/verify-schema-doc.mjs
