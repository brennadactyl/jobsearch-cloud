name = "job-search-tracker-client"
compatibility_date = "2025-01-01"

# The tracker page, served as static assets. A separate deployable from
# ../server/, which it calls cross-origin.
#
# Never change `name`: a deploy under a new name publishes a second Worker on a
# new URL and leaves the old one serving, stranding every bookmark and every
# browser's stored session on it.
#
# dist/ is built, so a deploy can't drop a gitignored file: `npm run deploy`
# builds first, and vite.config.ts refuses to build without VITE_API_BASE.
#
# Deploy from the main checkout on main, never a worktree - see
# ../.claude/skills/verify-and-deploy/SKILL.md.
[assets]
directory = "./dist"
# Tab routes (/applications, /all-leads, /t/<track>) aren't files in dist/, so
# without the SPA fallback they 404 on reload. vite dev and preview fall back on
# their own, so no local run shows it; src/deploy-config.test.ts pins it.
not_found_handling = "single-page-application"
