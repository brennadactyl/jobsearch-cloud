name = "job-search-tracker-client"
compatibility_date = "2025-01-01"

# Static assets only - no build step, no `main`. A separate deployable from
# ../server/.
#
# Everything under `directory` is published, so README.md, package.json and
# wrangler.toml stay outside ./public. A deploy also deletes live files missing
# from it: deploy with `npm run deploy`, whose predeploy-check.mjs refuses when
# the gitignored local-config.js is absent, as it is in any worktree.
[assets]
directory = "./public"
