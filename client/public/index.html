// 'waiting' must match getAutofillQueue() in server/src/db.js - a link, an
// unread flag and a blank company, role or location - or a row promises a
// fill no run will do. The blank-field condition is the easy one to drop.
function fillState(a){
  if((a.autofill||"")==="failed")return "stuck";
  if((a.autofill||"")===""&&safeUrl(a.link)&&
     (!a.company||!a.title||!a.location))return "waiting";
  return "";
}

function appsGridHtml(A){
  var COLS=9; // company/role/location/link/status/applied/days/details/remove
  var h='<div class="card grid-wrap"><table><thead><tr>'+
    // Location is here because Location A-Z is one of this tab's sorts. Link is
    // here because a row added by URL has nothing else to identify it until the
    // overnight fill reads the posting.
    '<th>Company</th><th>Role</th><th>Location</th><th>Link</th><th>Status</th><th>Applied</th><th>Days</th>'+
    '<th></th><th></th>'+
  '</tr></thead><tbody>';

  // Ordered by what needs you first. The middle group takes the tab's own
  // label: it holds every row with nothing wrong, not only applied ones.
  var groups=[
    {key:"stuck",label:"Couldn’t be read",note:"type it in, no run will fix this"},
    {key:"",label:(state.settings&&state.settings.applications_label)||"Applications",note:""},
    {key:"waiting",label:"Waiting on tonight’s fill",note:"added by link, nothing to do"}
  ].map(function(g){
    g.rows=A.filter(function(a){return fillState(a)===g.key;});
    return g;
  }).filter(function(g){return g.rows.length;});

  // A lone divider says nothing, so headers appear only with more than one
  // group.
  var grouped=groups.length>1;

  groups.forEach(function(grp){
    var shut=grouped&&!!ui.collapsed[grp.key];
    if(grouped){
      h+='<tr class="group'+(grp.key?" "+grp.key:"")+'"><td colspan="'+COLS+'">'+
        '<button class="grp" type="button" data-collapse="'+esc(grp.key)+'" '+
          'aria-expanded="'+(!shut)+'">'+
          '<span class="caret" aria-hidden="true">&#9662;</span>'+esc(grp.label)+
          '<span class="cnt">'+grp.rows.length+(grp.note?' &middot; '+esc(grp.note):'')+'</span>'+
        '</button></td></tr>';
    }
    if(shut)return;
    h+=grp.rows.map(function(a){
    var d=daysSince(a.dateApplied);
    var link=safeUrl(a.link);
    var open=!!ui.expanded[a.id];
    // Same location stripe as the leads grid, so the legend means the same on
    // both.
    var g=geo(a.location);
    // A stuck row's edge says stuck: it has no location to rank, and the one
    // thing worth knowing is that it's waiting on you.
    var clsList=(g&&grp.key!=="stuck"?[g.p]:[]).concat(
      grp.key==="stuck"?["stuck"]:[],
      String(ui.selected.applications)===String(a.id)?["gr-sel"]:[]);
    var cls=clsList.length?' class="'+clsList.join(" ")+'"':'';
    // Empty cells stay editable in every state; the placeholder says why they
    // are empty.
    var ph=grp.key==="waiting"?"Reads overnight":(grp.key==="stuck"?"Type it in":"");
    var row='<tr data-expand="'+a.id+'" data-scope="applications"'+cls+'>'+
      '<td><input type="text" data-id="'+a.id+'" data-field="company" data-app="1" value="'+esc(a.company)+'" placeholder="'+esc(ph||"Company")+'"></td>'+
      '<td><input type="text" data-id="'+a.id+'" data-field="title" data-app="1" value="'+esc(a.title)+'" placeholder="'+esc(ph||"Role")+'"></td>'+
      // An input: an application's location is the user's own to correct. No
      // tier badge: these rows are already decided on, so proximity is no
      // longer a question.
      '<td class="loc"><input type="text" data-id="'+a.id+'" data-field="location" data-app="1" value="'+esc(a.location)+'" placeholder="'+esc(ph||"Location")+'"></td>'+
      // The host, not the URL, to fit a narrow column; editing the URL is in
      // Detail view.
      '<td class="lk">'+(link
        ? '<a href="'+esc(link)+'" target="_blank" rel="noopener" title="'+esc(link)+'">'+esc(hostOf(link))+' &#8599;</a>'
        : '<span class="lk-none">&mdash;</span>')+'</td>'+
      '<td>'+selectHtml(APP_STATUS,a.status,'data-id="'+a.id+'" data-field="status" data-app="1"')+'</td>'+
      '<td><input type="date" data-id="'+a.id+'" data-field="dateApplied" data-app="1" value="'+esc(a.dateApplied)+'"></td>'+
      // In either fill state the column says what the row is waiting on
      // instead of a day count; a stuck row shows the run's note, which says
      // whether typing it in is the answer.
      '<td class="dt'+(grp.key?"":" mono")+'">'+(
        grp.key==="waiting"?'<span class="eta"><i class="pulse"></i>Tonight</span>'
        :grp.key==="stuck"?'<span class="stuck-note" title="'+esc(a.autofill_note||"")+'">'+
            '<i class="mark"></i>'+esc(a.autofill_note||"Couldn’t read it")+'</span>'
        :(d===null?"&mdash;":d))+'</td>'+
      '<td class="exp-ind">'+(open?'Hide':'Details')+'</td>'+
      '<td><button class="btn ghost" data-del="'+a.id+'" title="Remove">&times;</button></td>'+
    '</tr>';
    if(open){
      row+='<tr class="more-row"><td colspan="'+COLS+'">'+
        autofillNoteHtml(a)+factsCardsHtml(a,true,true)+'</td></tr>';
    }
    return row;
    }).join("");
  });
  h+='</tbody></table></div>';
  return h;
}

// Read off the originating lead rather than stored: the server never deletes
// a lead an application points at, so it's still in state.leads. A hand-added
// application has no track, and the line is dropped rather than guessed.
function appTrackLabel(a){
  if(!a.leadId)return "";
  var lead=state.leads.filter(function(l){return String(l.id)===String(a.leadId);})[0];
  return lead&&TRACKS[lead.search]?TRACKS[lead.search].label:"";
}

// Mirrors leadDetailHtml's header but as inputs styled as the headings they
// stand in for (see .dh-in): an application is added and corrected by hand,
// which a lead never needs.
function appDetailHtml(a){
  var d=daysSince(a.dateApplied);
  var g=geo(a.location);
  var track=appTrackLabel(a);
  var href=safeUrl(a.link);
  var fld=function(cls,field,val,ph){
    return '<input class="dh-in '+cls+'" type="text" data-id="'+a.id+'" data-field="'+field+
      '" data-app="1" value="'+esc(val||"")+'" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">';
  };
  var h='<div class="dh-app-top"><div class="dh-app-fields">'+
    (track?'<div class="dh-track">'+esc(track)+'</div>':'')+
    fld("dh-h1","company",a.company,"Company")+
    fld("dh-sub-in","title",a.title,"Role")+
    '<div class="dh-meta dh-app-meta">'+
      '<input class="dh-in dh-loc-in" type="text" data-id="'+a.id+'" data-field="location" data-app="1"'+
        ' size="'+Math.max(14,Math.min(38,String(a.location||"").length+1))+'"'+
        ' value="'+esc(a.location)+'" placeholder="Location" aria-label="Location">'+
      (g?'<span class="geo '+g.p+'">'+esc(g.label)+'</span>':'')+
      (href?'<span class="dh-sep">&middot;</span><a href="'+esc(href)+'" target="_blank" rel="noopener">View posting &#8599;</a>':'')+
    '</div>'+
  '</div>'+
  '<button class="icon-btn danger" data-del="'+a.id+'" title="Remove application" aria-label="Remove application">'+TRASH_ICON+'</button>'+
  '</div>';
  h+='<div class="dh-status">'+selectHtml(APP_STATUS,a.status,'data-id="'+a.id+'" data-field="status" data-app="1"')+
    '<span class="dh-dates">Applied <input type="date" data-id="'+a.id+'" data-field="dateApplied" data-app="1" value="'+esc(a.dateApplied)+'">'+
      (d!==null?' &middot; '+d+' days':'')+'</span></div>';
  h+=autofillNoteHtml(a);
  h+=factsCardsHtml(a,true,false);
  h+='<div class="dh-notes"><div class="mf-label">Notes</div>'+
    '<textarea data-id="'+a.id+'" data-field="notes" data-app="1" rows="3">'+esc(a.notes)+'</textarea></div>';
  return h;
}

// The pinned tile row sits outside .panel-scroll, so it must give up the same
// scrollbar width or sit wider than the cards below. Measured, not assumed: 0
// for overlay scrollbars and on the unpinned layout. Re-measured on resize,
// since crossing that breakpoint changes it without a re-render.
function syncScrollGutter(){
  var ov=document.querySelector(".panel-scroll");
  document.documentElement.style.setProperty("--sbw",
    ov?(ov.offsetWidth-ov.clientWidth)+"px":"0px");
}
window.addEventListener("resize",syncScrollGutter);

function markScrolled(ov){
  ov.classList.toggle("scrolled",ov.scrollTop>0);
}

function syncAddControl(){
  var url=document.getElementById("appurl"),
      btn=document.getElementById("addapp"),
      hint=document.getElementById("addhint");
  if(!url||!btn||!hint)return;
  var has=url.value.trim()!=="";
  btn.textContent=has?"Add from link":"Add empty row";
  btn.className=has?"btn primary":"btn";
  hint.textContent=has
    ? "Tonight’s run opens the posting and fills in the company, role and location."
    : "Adds a row for you to fill in yourself.";
}

function render(){
  var tabs=buildTabs();
  // ui.tab is restored from localStorage and can name a track since removed
  // from config; fall back to the first tab.
  var current=tabs.filter(function(t){return t.id===ui.tab;})[0];
  if(!current){current=tabs[0]; ui.tab=current.id;}
  document.getElementById("tabs").innerHTML=tabsHtml();
  var p=document.getElementById("panel");
  // Replacing the panel would reset list scroll on every click, including row
  // selection; carry it across the swap.
  var oldList=p.querySelector(".md-list"), scrollTop=oldList?oldList.scrollTop:null;
  // Same for the Overview's scroll region.
  var oldOv=p.querySelector(".panel-scroll"), ovTop=oldOv?oldOv.scrollTop:null;
  document.getElementById("app").classList.toggle("pinned",current.kind==="overview");
  if(current.kind==="overview")p.innerHTML=dashboard();
  else if(current.kind==="applications")p.innerHTML=appsTab();
  else if(current.kind==="allleads")p.innerHTML=leadsTab(ALL_LEADS);
  else p.innerHTML=leadsTab(current.id);
  var newOv=p.querySelector(".panel-scroll");
  syncAddControl();
  syncScrollGutter();
  if(newOv){
    // A fresh element each render, so the old listener goes with the old node.
    newOv.addEventListener("scroll",function(){markScrolled(newOv);});
    if(ovTop!==null)newOv.scrollTop=ovTop;
    // Restoring a scroll position has to restore the edge with it.
    markScrolled(newOv);
  }
  var newList=p.querySelector(".md-list");
  if(newList){
    if(scrollTop!==null){
      newList.scrollTop=scrollTop;
    }else{
      // No list to carry scroll from (e.g. coming from Grid view): bring the
      // selected row into view so Detail view doesn't hide the row just picked.
      var selRow=newList.querySelector(".md-row.sel");
      if(selRow)selRow.scrollIntoView({block:"nearest"});
    }
  }
}

document.addEventListener("click",function(e){
  if(e.target.id==="stageDateSave"){confirmStageDate();return;}
  if(e.target.id==="stageDateCancel"){closeStageDateModal(true);return;}
  // The backdrop, not the card: cancels like Cancel.
  if(e.target.id==="stageDateModal"){closeStageDateModal(true);return;}
  if(e.target.id==="tokenSubmit"){submitToken();return;}
  if(e.target.id==="logout"){logout();return;}
  if(e.target.closest("#themeToggle")){toggleTheme();return;}
  if(e.target.closest("#whoami")){openPwModal();return;}
  if(e.target.id==="pwCancel"){closePwModal();return;}
  if(e.target.id==="pwSave"){submitPwChange();return;}
  if(e.target.id==="pwModal"){closePwModal();return;}

  var dc=e.target.closest("[data-drill-clear]");
  if(dc){ui.drill=null; render(); return;}

  var col=e.target.closest("[data-collapse]");
  if(col){
    var ck=col.getAttribute("data-collapse");
    ui.collapsed[ck]=!ui.collapsed[ck];
    render();
    return;
  }

  var t=e.target.closest("[data-tab]");
  if(t){ui.tab=t.getAttribute("data-tab");ui.q="";
    // Only an Overview number carries a filter; any other tab link lands
    // unfiltered.
    var tf=t.getAttribute("data-tab-filter"), td=t.getAttribute("data-drill");
    ui.filter=tf||"All";
    ui.drill=(td&&DRILLS[td])?td:null;
    try{localStorage.setItem("bjs.tab",ui.tab);}catch(err){} render(); return;}

  var f=e.target.closest("[data-filter]");
  if(f){ui.filter=f.getAttribute("data-filter"); render(); return;}

  var vw=e.target.closest("[data-view]");
  if(vw){
    ui.view=vw.getAttribute("data-view");
    try{localStorage.setItem("bjs.view",ui.view);}catch(err){}
    render();
    return;
  }

  var sr=e.target.closest("[data-select]");
  if(sr){
    var scope=sr.getAttribute("data-scope");
    ui.selected[scope]=sr.getAttribute("data-select");
    render();
    return;
  }

  // The whole grid row toggles, so no precise click is needed - except on a
  // form control or link, which does its own job.
  var ex=e.target.closest("[data-expand]");
  if(ex&&!e.target.closest("input,select,textarea,a,button")){
    var exId=ex.getAttribute("data-expand"), exScope=ex.getAttribute("data-scope");
    ui.expanded[exId]=!ui.expanded[exId];
    // The clicked row is the one Detail view lands on.
    ui.selected[exScope]=exId;
    render();
    return;
  }

  if(e.target.id==="addapp"){addApplication();return;}

  var del=e.target.closest("[data-del]");
  // Removing a posting asks why: the reason is stored on the screened row left
  // behind, the only record of it and what stops tomorrow's run re-adding it.
  var rmLead=e.target.closest("[data-rmlead]");
  if(rmLead){
    var lid=rmLead.getAttribute("data-rmlead");
    var lrow=(state.leads||[]).filter(function(x){return String(x.id)===String(lid);})[0];
    var lname=lrow?((lrow.company||"")+" "+(lrow.title||"")).trim():"this posting";
    var why=prompt("Remove "+lname+"?\n\nWhy? This is kept so the search doesn't find it again.","outside target locations");
    if(why!==null&&why.trim()){
      setSaved("Saving…",false);
      api("/api/delete-leads",{method:"POST",body:JSON.stringify({ids:[lid],reason:why.trim()})}).then(function(r){
        if(r&&r.kept&&r.kept.length){setSaved("Kept — an application points at it","bad");return;}
        state.leads=(state.leads||[]).filter(function(x){return String(x.id)!==String(lid);});
        boot();
      }).catch(function(){setSaved("Couldn't save — try again","bad");});
    }
    return;
  }

  if(del){
    var id=del.getAttribute("data-del");
    var row=state.applications.filter(function(a){return String(a.id)===String(id);})[0];
    var name=row&&(row.company||row.title)?((row.company||"")+" "+(row.title||"")).trim():"this row";
    if(confirm("Remove "+name+" from Applications?")){
      setSaved("Saving…",false);
      api("/api/delete-application",{method:"POST",body:JSON.stringify({id:id})}).then(function(){
        state.applications=state.applications.filter(function(a){return String(a.id)!==String(id);});
        render();
        setSaved("Saved",true);
      }).catch(function(){setSaved("Couldn't save — try again","bad");});
    }
  }
});

document.addEventListener("keydown",function(e){
  if((e.target.id==="nameInput"||e.target.id==="passwordInput")&&e.key==="Enter"){submitToken();}
  if((e.target.id==="pwCurrent"||e.target.id==="pwNew"||e.target.id==="pwConfirm")&&e.key==="Enter"){submitPwChange();}
  if(e.key==="Escape"&&!document.getElementById("pwModal").classList.contains("hidden")){closePwModal();}
  if(pendingStage&&e.key==="Escape"){closeStageDateModal(true);return;}
  if(e.target.id==="stageDateInput"&&e.key==="Enter"){confirmStageDate();}
  // Paste, Enter, done: adding an application is one gesture.
  if(e.target.id==="appurl"&&e.key==="Enter"){addApplication();}
});

document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    ui.q=e.target.value;
    var pos=e.target.selectionStart; render();
    var n=document.getElementById("q"); if(n){n.focus();n.setSelectionRange(pos,pos);}
  }
  // No render(): repainting the panel under a field being typed into loses
  // the cursor.
  if(e.target.id==="appurl")syncAddControl();
});

// A pasted URL creates a row holding only the link, which alone queues it for
// the overnight fill (getAutofillQueue in server/src/db.js); the page keeps
// no fill state of its own. The duplicate check is exact-match on purpose: it
// catches pasting the same URL twice, and two URLs for one posting is just a
// row to delete.
function addApplication(){
  var box=document.getElementById("appurl");
  var url=box?box.value.trim():"";
  if(url){
    var same=(state.applications||[]).filter(function(a){
      return String(a.link||"").trim().toLowerCase()===url.toLowerCase();
    })[0];
    if(same){
      ui.selected.applications=same.id;
      render();
      setSaved("Already in your applications",true);
      return;
    }
  }
  setSaved("Saving…",false);
  api("/api/update",{method:"POST",body:JSON.stringify({
    type:"application",company:"",title:"",location:"",dateApplied:today(),status:"Applied",notes:"",
    team:"",setup:"",source:"",link:url,resume:"",referral:"",comp:""
  })}).then(function(res){
    state.applications.unshift(res.application);
    ui.selected.applications=res.application.id;
    render();
    setSaved(url?"Added — it fills in overnight":"Saved",true);
  }).catch(function(){setSaved("Couldn't save — try again","bad");});
}

function commit(el){
  var id=el.getAttribute("data-id"), field=el.getAttribute("data-field");
  if(!id||!field)return;
  var isApp=!!el.getAttribute("data-app");
  var list=isApp?state.applications:state.leads;
  var row=list.filter(function(r){return String(r.id)===String(id);})[0];
  if(!row||row[field]===el.value)return;
  // Status goes through its own endpoints, which validate it and own the side
  // effects a plain field write can't: creating a lead's application,
  // stamping a stage date.
  if(field==="status"){
    if(isApp)setApplicationStatus(id,el.value); else setLeadStatus(id,el.value);
    return;
  }
  row[field]=el.value;
  setSaved("Saving…",false);
  var body=isApp?{type:"application",id:id}:{type:"lead",id:id};
  body[field]=el.value;
  api("/api/update",{method:"POST",body:JSON.stringify(body)}).then(function(){
    setSaved("Saved",true);
  }).catch(function(){setSaved("Couldn't save — try again","bad");});
  // The link field gains or loses its "Open" anchor with its value, so it
  // re-renders now rather than on the next unrelated click.
  if(field==="link")render();
}

// Swaps in the server's authoritative row after a status change rather than
// guessing what changed.
function replaceById(list,item){
  for(var i=0;i<list.length;i++){
    if(String(list[i].id)===String(item.id)){list[i]=item;return true;}
  }
  return false;
}

// Lead status and pipeline stage are separate, so marking a lead "Applied"
// creates an application row; the server does both writes in one transaction
// (handleSetLeadStatus in server/src/routes/leads.js). The lead stays in the
// database because URL dedup needs it, and the server never deletes a lead an
// application points at (removeDelistedLead in server/src/routes/delisting.js).
function setLeadStatus(id,value){
  setSaved("Saving…",false);
  api("/api/leads/"+id+"/status",{method:"POST",body:JSON.stringify({status:value})}).then(function(res){
    replaceById(state.leads,res.lead);
    if(res.application&&!state.applications.some(function(a){return String(a.id)===String(res.application.id);})){
      state.applications.unshift(res.application);
    }
    setSaved("Saved",true);
    render();
  }).catch(function(){setSaved("Couldn't save — try again","bad");});
}

// Not a data-field="search" commit(): the selection has to follow the row to
// its new tab, and both failures - an unknown track key, or a destination
// already holding the URL (handleUpdate in server/src/routes/update.js) -
// deserve their own message. The visible tab stays put so you keep your place
// mid-triage. `selectEl` is reverted on failure because the browser has
// already repainted it when "change" fires.
function moveLead(id,key,selectEl){
  var row=state.leads.filter(function(r){return String(r.id)===String(id);})[0];
  if(!row||row.search===key)return;
  var from=row.search;
  setSaved("Moving…",false);
  api("/api/update",{method:"POST",body:JSON.stringify({type:"lead",id:id,search:key})})
    .then(function(res){
      if(!res||!res.lead){
        if(selectEl)selectEl.value=from;
        setSaved((res&&res.error)||"Couldn't move it — try again","bad");
        return;
      }
      replaceById(state.leads,res.lead);
      // A selection left on a lead no longer in the tab renders an empty detail
      // pane.
      if(String(ui.selected[from])===String(id))delete ui.selected[from];
      ui.selected[key]=res.lead.id;
      setSaved("Moved to "+((TRACKS[key]&&TRACKS[key].label)||key),true);
      render();
    })
    .catch(function(){
      if(selectEl)selectEl.value=from;
      setSaved("Couldn't move it — try again","bad");
    });
}

// The server stamps the new stage's history date if blank and returns the full
// row (handleSetApplicationStatus in server/src/routes/applications.js).
// `date` (YYYY-MM-DD) comes from the stage-date modal; without it the server
// uses today.
function setApplicationStatus(id,value,date){
  setSaved("Saving…",false);
  var body={status:value};
  if(date)body.date=date;
  api("/api/applications/"+id+"/status",{method:"POST",body:JSON.stringify(body)}).then(function(res){
    replaceById(state.applications,res.application);
    setSaved("Saved",true);
    render();
  }).catch(function(){setSaved("Couldn't save — try again","bad");});
}

// The status change awaiting #stageDateModal, or null. prevStatus reverts the
// <select> on Cancel, since the browser has already changed it when "change"
// fires.
var pendingStage=null;

// Screens and loops are booked ahead, so their date is often in the future:
// the modal asks when it's scheduled rather than when it happened.
var STAGE_SCHEDULED={"Recruiter Screen":1,"Tech Screen":1,"Onsite / Loop":1};

function openStageDateModal(app,newStatus,dateField,selectEl){
  pendingStage={id:app.id,status:newStatus,dateField:dateField,prevStatus:app.status,selectEl:selectEl};
  document.getElementById("stageDateTitle").textContent=
    STAGE_SCHEDULED[newStatus]?"When is this scheduled?":"When did this happen?";
  document.getElementById("stageDateSub").textContent=
    (app.company||app.title||"This application")+" — "+newStatus;
  var input=document.getElementById("stageDateInput");
  input.value=today();
  document.getElementById("stageDateModal").classList.remove("hidden");
  input.focus();
}

function closeStageDateModal(revert){
  if(revert&&pendingStage&&pendingStage.selectEl)pendingStage.selectEl.value=pendingStage.prevStatus;
  pendingStage=null;
  document.getElementById("stageDateModal").classList.add("hidden");
}

function confirmStageDate(){
  if(!pendingStage)return;
  var date=document.getElementById("stageDateInput").value;
  if(!date)return; // the date is the whole point of this dialog - require one
  var p=pendingStage;
  pendingStage=null;
  document.getElementById("stageDateModal").classList.add("hidden");
  setApplicationStatus(p.id,p.status,date);
}

document.addEventListener("change",function(e){
  var so=e.target.closest("[data-sort]");
  if(so){
    var kind=so.getAttribute("data-sort");
    if(kind==="leads"){ui.leadSort=so.value;try{localStorage.setItem("bjs.leadSort",ui.leadSort);}catch(err){}}
    else{ui.appSort=so.value;try{localStorage.setItem("bjs.appSort",ui.appSort);}catch(err){}}
    render();
    return;
  }
  var mv=e.target.closest("[data-movelead]");
  if(mv){
    moveLead(mv.getAttribute("data-movelead"),mv.value,mv);
    return;
  }
  // A move into a stage whose history column is blank asks for the date first:
  // status changes are often logged days after (or before) they happen.
  if(e.target.matches('select[data-field="status"][data-app]')){
    var appId=e.target.getAttribute("data-id");
    var app=state.applications.filter(function(a){return String(a.id)===String(appId);})[0];
    if(app){
      var newStatus=e.target.value, dateField=APP_STAGE_DATE_MAP[newStatus];
      if(newStatus!==app.status&&dateField&&!app[dateField]){
        openStageDateModal(app,newStatus,dateField,e.target);
        return;
      }
    }
  }
  if(e.target.matches("select[data-id],input[data-id]"))commit(e.target);
});
document.addEventListener("focusout",function(e){
  if(e.target.matches("textarea[data-id],input[data-id]"))commit(e.target);
});

// Without an API URL (client/README.md, "How it finds its API") no sign-in can
// succeed, and a visitor can't fix it, so hide the fields and say so.
if(!API_BASE){
  document.getElementById("gateHint").textContent="This deployment has no API URL configured - see public/local-config.example.js.";
  document.getElementById("nameInput").classList.add("hidden");
  document.getElementById("passwordInput").classList.add("hidden");
  document.getElementById("tokenSubmit").classList.add("hidden");
}
if(NAME)document.getElementById("nameInput").value=NAME;
if(TOKEN&&API_BASE)boot(); else document.getElementById("gate").classList.remove("hidden");
})();
</script>
