<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F5F9; --surface:#FFFFFF; --surface2:#ECEEF6; --line:#DCDFEB;
  --ink:#14172A; --ink2:#555B77; --ink3:#868CA6;
  --accent:#0F766E; --accent-soft:#D8F3F0;
  --good:#226642; --warn:#96600F; --crit:#A93A31;
  --pri-0:#1D4ED8; --pri-0-soft:#DBEAFE;
  --pri-1:#BE185D; --pri-1-soft:#FCE7F3;
  --pri-2:#047857; --pri-2-soft:#D1FAE5;
  --pri-3:#B45309; --pri-3-soft:#FEF3C7;
  --pri-4:#6D28D9; --pri-4-soft:#EDE9FE;
  --shadow:0 1px 2px rgba(20,23,42,.06),0 8px 24px -12px rgba(20,23,42,.18);
}
/* Dark tokens follow the OS preference unless #themeToggle has set
   data-theme. Every dark override needs both this guarded query and a
   [data-theme="dark"] rule, or an explicit choice loses to the OS setting. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1018; --surface:#161925; --surface2:#1E2230; --line:#2A2F41;
  --ink:#E9EBF4; --ink2:#A3AAC3; --ink3:#717892;
  --accent:#2DD4BF; --accent-soft:#0F2E2A;
  --good:#4FBE85; --warn:#DFA63C; --crit:#E8756A;
  --pri-0:#60A5FA; --pri-0-soft:#14243F;
  --pri-1:#F472B6; --pri-1-soft:#3A1830;
  --pri-2:#34D399; --pri-2-soft:#0C2C22;
  --pri-3:#FBBF24; --pri-3-soft:#332309;
  --pri-4:#A78BFA; --pri-4-soft:#241C3D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0E1018; --surface:#161925; --surface2:#1E2230; --line:#2A2F41;
  --ink:#E9EBF4; --ink2:#A3AAC3; --ink3:#717892;
  --accent:#2DD4BF; --accent-soft:#0F2E2A;
  --good:#4FBE85; --warn:#DFA63C; --crit:#E8756A;
  --pri-0:#60A5FA; --pri-0-soft:#14243F;
  --pri-1:#F472B6; --pri-1-soft:#3A1830;
  --pri-2:#34D399; --pri-2-soft:#0C2C22;
  --pri-3:#FBBF24; --pri-3-soft:#332309;
  --pri-4:#A78BFA; --pri-4-soft:#241C3D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
/* The Overview scrolls inside itself while other tabs scroll the window;
   a stable gutter keeps the column width the same on every tab. */
html{scrollbar-gutter:stable}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 72px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* Title and tab bar stick as one unit so the board and tab stay on screen.
   Needs its own background or the rows show through it. */
.topbar{position:sticky;top:0;z-index:20;background:var(--ground)}
/* A short viewport cannot spare ~110px on a title you have already read -
   there, only the tab bar stays (.tabs is sticky in its own right). */
@media (max-height:620px){.topbar{position:static}}

.hdr{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;padding:30px 0 18px}
.hdr h1{font-size:clamp(24px,3.6vw,33px);font-weight:700}
.hdr .sub{color:var(--ink2);font-size:14px;margin-top:5px}
.hdr-right{display:flex;align-items:center;gap:12px}
#themeToggle{font-size:15px;line-height:1;padding:6px 9px}
.stamp{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:9px}
.who{appearance:none;border:0;background:none;padding:0;font:inherit;
  font-size:12px;color:var(--ink3);cursor:pointer;border-radius:4px}
.who:hover{color:var(--ink2);text-decoration:underline}
.who:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* An empty button still takes a focus stop and a hit area. */
.who:empty{display:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink3)}
.dot.bad{background:var(--crit)}

.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:var(--ground);padding-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;border:0;background:none;cursor:pointer;color:var(--ink2);
  font:inherit;font-weight:500;padding:11px 14px;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  background:var(--surface2);padding:1px 6px;border-radius:9px}
.tab[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}
/* A bare dot, not a count: a "look here" marker, explained one click away on
   the tab itself (see trackWarn). */
.tab .tabwarn{width:6px;height:6px;border-radius:50%;flex:none;margin-left:-2px}
.tab .tabwarn.stale{background:var(--warn)}
.tab .tabwarn.error{background:var(--crit)}
/* Amber like .stale: both are waiting on you. */
.tab .tabwarn.fill{background:var(--warn)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 0 12px}
.search{flex:1;min-width:180px;max-width:320px}
.hint{font-size:13px;color:var(--ink3)}
input[type=search],input[type=text],input[type=url],input[type=date],input[type=password],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;width:100%}
/* Chrome paints autofilled inputs with its own !important colours - a white
   box on the dark palette. background-color can't beat that; an inset shadow
   painted over the top can, and text-fill-color does the same for the text. */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 100px var(--surface) inset;
  caret-color:var(--ink)}
textarea{resize:vertical;min-height:34px}
.btn{appearance:none;font:inherit;font-weight:500;cursor:pointer;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
/* White text fails contrast on the dark accent. Guarded like the :root token
   blocks above. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#241B08}}
:root[data-theme="dark"] .btn.primary{color:#241B08}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;cursor:pointer;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:4px 11px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip.drill{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.drill .x{margin-left:7px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.more-row:hover{background:none}
tr.more-row td{padding:4px 12px 14px}
.co{font-weight:600;white-space:nowrap}
.dt{color:var(--ink3);font-size:12.5px;white-space:nowrap}
.geo{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:2px 8px;border-radius:99px;white-space:nowrap}
/* One class per priority_locations rank (see priClass). Five are coloured;
   a sixth renders uncoloured rather than in shades nobody can tell apart. */
.geo.pri0{background:var(--pri-0-soft);color:var(--pri-0)}
.geo.pri1{background:var(--pri-1-soft);color:var(--pri-1)}
.geo.pri2{background:var(--pri-2-soft);color:var(--pri-2)}
.geo.pri3{background:var(--pri-3-soft);color:var(--pri-3)}
.geo.pri4{background:var(--pri-4-soft);color:var(--pri-4)}
.key{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:12.5px;
  color:var(--ink3);padding:0 0 11px}
/* The last flex item, so a wrapped row drops it onto its own line instead
   of stranding it mid-row. */
.key-run{margin-left:auto}
/* Sort lives in this muted row, not the toolbar: a setting you glance at, not
   one you touch per visit. Still a real <select>, styled down to match. */
.key .sortwrap{gap:5px}
.key .sort-label{font-weight:400}
.key select.sortsel{background:none;border:1px solid transparent;color:var(--ink3);
  font-size:12.5px;padding:1px 3px;min-width:0}
.key select.sortsel:hover,.key select.sortsel:focus-visible{border-color:var(--line)}

/* Stale and error must read as warnings, not grey metadata (see runState). */
.runstamp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.runstamp .rdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--good)}
.runstamp.none{color:var(--ink3)}
.runstamp.stale{color:var(--warn);font-weight:500}
.runstamp.stale .rdot{background:var(--warn)}
.runstamp.error{color:var(--crit);font-weight:500}
.runstamp.error .rdot{background:var(--crit)}
.legend-run{margin-left:auto;padding-left:12px}
.empty-warn{margin-top:10px;color:var(--warn);font-size:13px}
.key i{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

.viewsw{display:flex;gap:2px;margin-left:auto;background:var(--surface2);padding:3px;border-radius:8px}
.vbtn{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink2);padding:5px 12px;border-radius:6px;cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.vbtn:hover{color:var(--ink)}

.sortwrap{display:flex;align-items:center;gap:7px}
.sort-label{font-size:12.5px;font-weight:600;color:var(--ink3)}
.sortsel{width:auto;min-width:150px}

.grid-wrap{overflow-x:auto}
.grid-wrap a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}
.grid-wrap a:hover{border-bottom-color:var(--accent)}
.loc{color:var(--ink2);font-size:13px;max-width:200px}
.loc-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .geo{display:inline-block;margin-top:3px}
td.rc{max-width:260px}
td.rc a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.cc{max-width:170px;overflow:hidden;text-overflow:ellipsis}
/* Capped: hostnames are usually short, but nothing guarantees it. */
td.lk{max-width:150px}
td.lk a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.lk .lk-none{color:var(--ink3)}

/* The applications grid's fill-state groups (see appsGridHtml). A labelled
   divider keeps it reading as one table, and the whole divider is the fold
   control because the caret alone is too small a target. */
tr.group td{background:var(--surface2);border-bottom:1px solid var(--line);padding:0}
.grp{appearance:none;border:0;background:none;cursor:pointer;font:inherit;color:var(--ink3);
  display:flex;align-items:center;width:100%;text-align:left;padding:7px 12px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grp:hover{background:var(--line)}
.grp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grp .caret{flex:none;margin-right:9px;font-size:10px;line-height:1;
  transition:transform .12s ease}
.grp[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.grp .cnt{font-family:"IBM Plex Mono",monospace;text-transform:none;letter-spacing:0;
  font-weight:400;margin-left:8px}
/* Folded away, the count is the only thing left saying what is in there. */
.grp[aria-expanded="false"] .cnt{color:var(--ink2)}
tr.group.stuck .grp,tr.group.stuck .grp .cnt{color:var(--warn)}

tr.waiting input::placeholder,tr.stuck input::placeholder{font-style:italic}
.eta{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink2)}
.eta .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
tr.stuck td:first-child{border-left-color:var(--warn)}
.stuck-note{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:500;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stuck-note .mark{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
td:first-child{border-left:3px solid transparent}
tr.pri0 td:first-child{border-left-color:var(--pri-0)}
tr.pri1 td:first-child{border-left-color:var(--pri-1)}
tr.pri2 td:first-child{border-left-color:var(--pri-2)}
tr.pri3 td:first-child{border-left-color:var(--pri-3)}
tr.pri4 td:first-child{border-left-color:var(--pri-4)}
td select{padding:5px 7px;font-size:13px;min-width:112px}
td input[type=text],td input[type=date]{font-size:13px;min-width:104px}
td textarea{font-size:13px;min-height:32px;min-width:130px}
.grid-wrap tbody tr[data-expand]{cursor:pointer}
.grid-wrap tbody tr.gr-sel{background:var(--accent-soft)}
.grid-wrap tbody tr.gr-sel:hover{background:var(--accent-soft)}
.exp-ind{color:var(--ink3);font-size:12.5px;white-space:nowrap}

.md{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.md-list{width:348px;flex:0 0 348px;border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;max-height:min(720px,calc(100vh - 260px))}
.md-row{padding:12px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent;
  cursor:pointer}
.md-row:last-child{border-bottom:0}
.md-row:hover{background:var(--surface2)}
.md-row.sel{background:var(--accent-soft)}
.md-row.sel:hover{background:var(--accent-soft)}
.md-row.pri0{border-left-color:var(--pri-0)}
.md-row.pri1{border-left-color:var(--pri-1)}
.md-row.pri2{border-left-color:var(--pri-2)}
.md-row.pri3{border-left-color:var(--pri-3)}
.md-row.pri4{border-left-color:var(--pri-4)}
.md-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.md-row-top .co{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.md-row-top .pill{flex:0 0 auto}
.md-row-ttl{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.md-row-track{display:inline-block;margin-left:7px;padding:0 6px;border-radius:4px;
  background:var(--surface2);color:var(--ink3);font-size:11px;white-space:nowrap}
.md-row-loc{font-size:11.5px;color:var(--ink3);margin-top:7px;display:flex;align-items:baseline}
.md-row-loc .geo{flex:0 0 auto;margin-left:6px;padding:1px 7px}
.md-row-place{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-row-found{flex:0 0 auto;margin-left:auto;padding-left:10px;white-space:nowrap}
.md-detail{flex:1;min-width:0;padding:22px 28px;overflow-y:auto;
  max-height:min(720px,calc(100vh - 260px))}
.md-empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.dh-track{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
/* Reads as the plain track label until hovered, like .dh-in. -7px cancels
   the padding so the text keeps the label's left edge. */
select.dh-track-in{width:auto;max-width:100%;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink3);border:1px solid transparent;background:none;
  padding:2px 7px;margin-left:-7px;cursor:pointer}
select.dh-track-in:hover,select.dh-track-in:focus{border-color:var(--line);background:var(--surface)}
.dh-head h1{font-size:21px;margin-top:6px}
.dh-sub{font-size:14.5px;color:var(--ink2);margin-top:6px}
.dh-meta{font-size:12.5px;color:var(--ink3);margin-top:10px}
.dh-meta a{color:var(--accent)}
.dh-fit{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}

/* Application header fields (see appDetailHtml) draw their box only on hover
   or focus, so the header reads as a heading. Selectors are `input.dh-*`
   because a bare class loses to the shared input rule's attribute selector. */
.dh-app-top{display:flex;gap:10px;align-items:flex-start}
.dh-app-fields{flex:1;min-width:0}
.dh-app-top .icon-btn{flex:0 0 auto;margin-top:2px}
/* -8px: the text sits past the 1px border as well as the 7px padding, and it
   must line up with the track line and status row. */
input.dh-in{width:calc(100% + 8px);border:1px solid transparent;background:none;color:var(--ink);
  border-radius:7px;padding:3px 7px;margin-left:-8px}
input.dh-in:hover,input.dh-in:focus{border-color:var(--line);background:var(--surface)}
input.dh-in::placeholder{color:var(--ink3)}
input.dh-h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
input.dh-sub-in{font-size:14.5px;color:var(--ink2);margin-top:3px}
.dh-app-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:7px}
/* Width comes from the `size` appDetailHtml sets from the value, so the
   field hugs its text instead of pushing the tier and link to the far edge. */
input.dh-loc-in{width:auto;max-width:calc(100% + 8px);font-size:12.5px;color:var(--ink3)}
.dh-sep{color:var(--ink3)}
.dh-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.dh-status select{width:auto;min-width:150px}
.dh-status input[type=date]{width:auto}
.dh-dates{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dh-notes{margin-top:22px}
.icon-btn{appearance:none;flex:none;border:1px solid transparent;border-radius:8px;
  background:none;cursor:pointer;padding:9px;display:inline-flex;color:var(--ink3)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.danger{color:var(--crit)}
.icon-btn.danger:hover{background:var(--surface2);border-color:var(--crit)}
.mf-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.facts-card{margin-top:22px;padding:18px 20px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.facts-card .more-grid{padding:0}
@media (max-width:900px){
  .md{flex-direction:column}
  .md-list{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);max-height:280px}
  .md-detail{max-height:none}
}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  border:1px solid transparent;white-space:nowrap}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--surface2);color:var(--ink2)}
.pill.go{background:var(--surface2);color:var(--good);border-color:var(--good)}
.pill.no{background:none;color:var(--ink3);border-color:var(--line)}
.pill.hot{background:var(--surface2);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:none;color:var(--crit);border-color:var(--crit)}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:20px}

/* Overview only (render() adds .pinned): header, tabs and tiles hold still
   while .panel-scroll scrolls. The column measures itself rather than using
   .md-list's fixed calc(100vh - 260px), so a wrapped header or a second tile
   row can't push the bottom off screen. */
#app.pinned{height:100vh;height:100dvh;display:flex;flex-direction:column}

<!-- Gitignored deploy-time API URL: see client/README.md, "How it finds its API". -->
<script src="local-config.js"></script>
<script>
(function(){
"use strict";

function effectiveTheme(){
  var explicit=document.documentElement.getAttribute("data-theme");
  if(explicit==="light"||explicit==="dark")return explicit;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
}
function paintThemeToggle(){
  var btn=document.getElementById("themeToggle");
  if(!btn)return;
  var next=effectiveTheme()==="dark"?"light":"dark";
  btn.textContent=next==="dark"?"🌙":"☀️";
  btn.setAttribute("aria-label","Switch to "+next+" theme");
  btn.title=btn.getAttribute("aria-label");
}
function toggleTheme(){
  var next=effectiveTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("bjs.theme",next);}catch(e){}
  paintThemeToggle();
}
paintThemeToggle();

var LEAD_STATUS=["New","Reviewing","Applied","Not a fit"];
// LEAD_STATUS (above) and APP_STATUS mirror server/src/routes/leads.js and
// applications.js - no build step shares code. "To Apply" is logged but not
// yet sent, so it has no applied date: handleSetApplicationStatus clears
// dateApplied on a move to it and stamps it, if blank, on a move to "Applied".
var APP_STATUS=["To Apply","Applied","Recruiter Screen","Tech Screen","Onsite / Loop","Offer","Rejected","Withdrawn"];
var ACTIVE=["Recruiter Screen","Tech Screen","Onsite / Loop"];
var TRASH_ICON='<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" '+
  'stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M3 4.5h10"/><path d="M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5"/>'+
  '<path d="M4.5 4.5 5 13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5"/>'+
  '<path d="M6.7 7v4M9.3 7v4"/></svg>';
// Filled from /api/data by applyConfig(), never hardcoded, so one deploy
// serves any installer's tracks.
var TRACKS={};

// localStorage throws, rather than returning null, where storage is blocked;
// unguarded, that would stop the gate rendering. Sign-in still works, it just
// isn't remembered.
var TOKEN="",NAME="";
try{
  TOKEN=localStorage.getItem("tracker_token")||"";
  // Display only, kept across sign-outs to prefill the gate. The server decides
  // whose data this is from the token alone.
  NAME=localStorage.getItem("tracker_name")||"";
}catch(e){}
// The API worker's origin, no trailing slash, from local-config.js - see
// client/README.md, "How it finds its API".
var API_BASE=(typeof LOCAL_API_BASE!=="undefined"?LOCAL_API_BASE:"");
// Mirrors the display keys of DEFAULT_SETTINGS in server/src/db.js. Only
// fills keys the API omits.
function defaultSettings(){
  return {display_title:"Job Search Tracker",overview_label:"Overview",
    applications_label:"Applications",all_leads_label:"All leads",
    stale_run_hours:36,priority_locations:[]};
}
var state={updated:null,leads:[],applications:[],tracks:[],settings:defaultSettings()};

function buildTracks(list){
  var t={};
  (list||[]).slice().sort(function(a,b){
    return (a.sort_order-b.sort_order)||String(a.key).localeCompare(String(b.key));
  }).forEach(function(tr){
    t[tr.key]={label:tr.label,full:tr.full_description,run:tr.last_run||null};
  });
  return t;
}

// The tab bar as data: `kind` picks the panel and labels come from config, so
// nothing special-cases a tab by id and a track added to the database is a tab.
function buildTabs(){
  var s=state.settings||{};
  var tabs=[
    {id:"dashboard",kind:"overview",label:s.overview_label||"Overview",n:null},
    {id:"applications",kind:"applications",label:s.applications_label||"Applications",
     n:state.applications.length,
     // An unreadable posting waits on you: no later run retries it.
     warn:state.applications.some(function(a){return a.autofill==="failed";})
       ? {cls:"fill",title:"A posting couldn’t be read — a row here needs filling in by hand"}
       : null},
    // Every track's leads in one list, because the Overview's tiles count
    // across tracks and a number you can't open is one you stop trusting. Its
    // badge counts New like a track tab's, so it reads as their sum.
    {id:ALL_LEADS,kind:"allleads",label:s.all_leads_label||"All leads",
     n:state.leads.filter(function(l){return l.status==="New";}).length},
  ];
  Object.keys(TRACKS).forEach(function(k){
    tabs.push({id:k,kind:"track",label:TRACKS[k].label,
      // Counts only New: the badge is what hasn't been triaged yet.
      n:state.leads.filter(function(l){return l.search===k&&l.status==="New";}).length,
      warn:trackWarn(k)});
  });
  return tabs;
}

function trackWarn(k){
  var st=runState(TRACKS[k]&&TRACKS[k].run);
  if(st==="error")return {cls:"error",title:"The last scheduled run reported an error"};
  if(st==="stale")return {cls:"stale",title:"This search hasn’t run recently"};
  return null;
}

function applyConfig(){
  TRACKS=buildTracks(state.tracks);
  var title=(state.settings&&state.settings.display_title)||"Job Search Tracker";
  document.title=title;
  var titleEl=document.getElementById("appTitle"); if(titleEl)titleEl.textContent=title;
  var n=state.tracks.length;
  var subEl=document.getElementById("appSub");
  // A brand-new deployment has no tracks until setup posts its config, and
  // "across 0 tracked searches" reads like a bug rather than a first run.
  if(subEl)subEl.textContent=n
    ? "Verified openings across "+n+" tracked search"+(n===1?"":"es")+
      ", refreshed daily. Edit anything — it saves for every device."
    : "No tracked searches configured yet — run the job-search-setup skill to add one.";
}
var ui={tab:"dashboard",q:"",filter:"All",selected:{},expanded:{},view:"detail",leadSort:"priority",appSort:"applied-desc",drill:null,collapsed:{}};

// A tab id like "dashboard" and "applications", not a track key.
var ALL_LEADS="allleads";


// Facts-card fields. Leads omit "link" because their header already links
// l.url. Applications keep it as an input: a hand-added row has no other URL,
// and Grid view's expanded row shows these cards with no header above them.
// The lastContact/nextAction/nextActionDate columns are unused - don't revive
// them: the stage-date modal already records upcoming stages, and a hand-typed
// reminder would be a second copy that goes stale.
var ROLE_FIELDS=[
  ["referral","Referral"],
  ["comp","Comp range"],
  ["team","Team / product"],
  ["setup","Work setup"]
];
var APP_ROLE_FIELDS=ROLE_FIELDS.concat([["link","Link"]]);

// One history date per pipeline stage after "Applied" (which has
// dateApplied). The server stamps it the first time status moves there; the
// inputs stay editable so a wrong or skipped date can be fixed by hand.
var STAGE_DATE_FIELDS=[
  ["Recruiter Screen","dateRecruiterScreen"],
  ["Tech Screen","dateTechScreen"],
  ["Onsite / Loop","dateOnsite"],
  ["Offer","dateOffer"],
  ["Rejected","dateRejected"],
  ["Withdrawn","dateWithdrawn"]
];

// Overview drill-downs, named by tiles and funnel rows and resolved through
// drillRows(). `scope` is the kind of tab that shows one, `label` its chip.
var DRILLS={
  // leadRows() already drops Applied leads, so only "Not a fit" is excluded.
  "top-geo-open":{scope:"leads",
    label:function(){
      var r=(state.settings.priority_locations||[])[0];
      return (r?r.label:"Top locations")+" · still open";
    },
    test:function(l){var g=geo(l.location);return !!g&&g.i===0&&l.status!=="Not a fit";}},
  "in-conversation":{scope:"apps",label:"In screen or loop stage",
    test:function(a){return ACTIVE.indexOf(a.status)>=0;}},
  "gone-quiet":{scope:"apps",label:"Applied 14+ days ago, no reply",
    test:function(a){var d=daysSince(a.dateApplied);
      return a.status==="Applied"&&d!==null&&d>14;}},
  "applied":{scope:"apps",label:"Applied",
    test:function(a){return a.status!=="To Apply";}}
};
// These test the stage date, not the current status: a status change never
// clears it, so an application rejected after a tech screen still counts as
// having reached one.
STAGE_DATE_FIELDS.forEach(function(s){
  DRILLS["reached-"+s[1]]={scope:"apps",label:"Reached "+s[0],
    test:function(a){return a.status!=="To Apply"&&!!a[s[1]];}};
});

function drillLabel(id){
  var d=DRILLS[id]; if(!d)return "";
  return typeof d.label==="function"?d.label():d.label;
}
function drillKeeps(scope,row){
  var d=DRILLS[ui.drill];
  if(!d||d.scope!==scope)return true;
  return d.test(row);
}
// Only in the tab the drill belongs to: a filter you can't see is a page
// misreporting what it shows.
function drillChipHtml(scope){
  var d=DRILLS[ui.drill];
  if(!d||d.scope!==scope)return "";
  return '<button class="chip drill" data-drill-clear="1" aria-pressed="true" '+
    'title="Clear this filter">'+esc(drillLabel(ui.drill))+
    '<span class="x" aria-hidden="true">×</span></button>';
}

// Every lead count and list starts here, so none of them can include Applied
// leads, which have moved to the Applications tab (see setLeadStatus).
function leadRows(key){
  var isAll=(key===ALL_LEADS);
  return state.leads.filter(function(l){
    return (isAll||l.search===key)&&l.status!=="Applied";
  });
}
// Unlike leadRows(), keeps every row, "To Apply" included. Returns a copy:
// callers sort it.
function appRows(){
  return state.applications.slice();
}
// The rows a tile or funnel row opens. Its count is this list's length, so
// the number and the rows it lands on are one expression. `filter` is a status
// chip; `drill` is a DRILLS key, applied only when its scope matches the tab,
// as drillKeeps() does.
function drillRows(t){
  var isApps=(t.tab==="applications");
  var rows=isApps?appRows():leadRows(t.tab);
  if(t.filter)rows=rows.filter(function(r){return r.status===t.filter;});
  var d=t.drill?DRILLS[t.drill]:null;
  if(d&&d.scope===(isApps?"apps":"leads"))rows=rows.filter(d.test);
  return rows;
}

var STAGE_HISTORY_FIELDS=[["dateApplied","Applied"]].concat(
  STAGE_DATE_FIELDS.map(function(s){return [s[1],s[0]];}));
// Mirrors STAGE_DATE_MAP in server/src/routes/applications.js. A status whose
// column is still blank asks for a date first (see the change listener).
var APP_STAGE_DATE_MAP={"Applied":"dateApplied"};
STAGE_DATE_FIELDS.forEach(function(s){APP_STAGE_DATE_MAP[s[0]]=s[1];});

// Only http(s) becomes an anchor; a bare "acme.com/jobs/1" gets https://
// assumed. Anything else (javascript:, data:, a note) returns "" rather than
// an href built from typed text.
function safeUrl(v){
  var t=String(v==null?"":v).trim();
  if(!t)return "";
  if(/^https?:\/\//i.test(t))return t;
  if(/^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(t))return "https://"+t;
  return "";
}

// Stands in for the company on an application that is still only a URL, so a
// list of such rows can be told apart. Displayed, never stored: a host is good
// enough to find a row by, not to record as the company.
function hostOf(v){
  var u=safeUrl(v);
  if(!u)return "";
  try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}
}

// Says something only when there is something to do: a failed read, or a
// partial one that left a note. The note is shown verbatim because causes ask
// different things of the reader (a taken-down posting vs a site that blocks
// fetches). No retry: each row is read once
// (server/migrations/0009_application_autofill.sql).
function autofillNoteHtml(a){
  var note=a.autofill_note||"";
  if(!note)return "";
  var failed=(a.autofill||"")==="failed";
  return '<div class="af'+(failed?" bad":"")+'">'+
    (failed
      ? 'The nightly fill could not read this posting &mdash; fill it in by hand.'
      : 'The nightly fill read part of this posting &mdash; check what&rsquo;s missing.')+
    ' <span class="af-why">'+esc(note)+'</span>'+
  '</div>';
}

function factsGridHtml(item,fields,isApp){
  var appAttr=isApp?' data-app="1"':'';
  return '<div class="more-grid">'+fields.map(function(f){
    var key=f[0],label=f[1],type=f[2]||"text";
    var val=item[key]||"";
    var input=type==="date"
      ?'<input type="date" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'">'
      :'<input type="text" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'" placeholder="'+esc(label)+'">';
    // The link stays an editable input, so opening it is an anchor beside the
    // label.
    var href=key==="link"?safeUrl(val):"";

// "priority" sinks "Not a fit" below everything - it's screened out and
// shouldn't compete for the spots the location ranking surfaces - then orders
// by rank, newest found first. The flat sorts are for hunting a specific row.
var LEAD_SORTS=[
  ["priority","Priority"],
  ["found-desc","Newest found"],
  ["found-asc","Oldest found"],
  ["location-asc","Location A-Z"],
  ["company-asc","Company A-Z"]
];
function leadComparator(sortKey){
  if(sortKey==="found-desc")return function(a,b){return String(b.found).localeCompare(String(a.found));};
  if(sortKey==="found-asc")return function(a,b){return String(a.found).localeCompare(String(b.found));};
  if(sortKey==="location-asc")return function(a,b){return String(a.location).localeCompare(String(b.location));};
  if(sortKey==="company-asc")return function(a,b){return String(a.company).localeCompare(String(b.company));};
  return function(a,b){
    var na=a.status==="Not a fit"?1:0, nb=b.status==="Not a fit"?1:0;
    if(na!==nb)return na-nb;
    var d=rank(a)-rank(b); if(d)return d;
    return String(b.found).localeCompare(String(a.found));
  };
}

// Defaults to newest applied: the API returns applications oldest-first
// (ORDER BY id), and the freshest are what this tab is opened for.
var APP_SORTS=[
  ["applied-desc","Newest applied"],
  ["applied-asc","Oldest applied"],
  ["location-asc","Location A-Z"],
  ["company-asc","Company A-Z"]
];
function appComparator(sortKey){
  if(sortKey==="company-asc")return function(a,b){return String(a.company).localeCompare(String(b.company));};
  if(sortKey==="location-asc")return function(a,b){
    // A hand-added application can have no location; blanks sink rather than
    // top the sort that asks where rows are.
    var ea=a.location?0:1, eb=b.location?0:1;
    if(ea!==eb)return ea-eb;
    return String(a.location).localeCompare(String(b.location));
  };
  var byDate=sortKey==="applied-asc"
    ?function(a,b){return String(a.dateApplied).localeCompare(String(b.dateApplied));}
    :function(a,b){return String(b.dateApplied).localeCompare(String(a.dateApplied));};
  // "To Apply" rows have no applied date, so a date sort would strand the only
  // rows still owing an application at one end; float them to the top.
  // Company A-Z above stays strictly alphabetical.
  return function(a,b){
    var ta=a.status==="To Apply"?0:1, tb=b.status==="To Apply"?0:1;
    if(ta!==tb)return ta-tb;
    return byDate(a,b);
  };
}

function daysSince(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));}

function hoursSince(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;
  return Math.max(0,(Date.now()-t)/3600000);}

function today(){return new Date().toISOString().slice(0,10);}

// ---- Scheduled-run status (search_runs, server/migrations/0001_schema.sql)
//
// The last recorded run is the only signal that tells "ran and found nothing"
// from "stopped running"; lead counts and tabs look identical in both cases.

// "ok" | "stale" | "error" | "never". "never" isn't a problem: it's a new
// track before its first run, and flagging it would cover every new install
// in warnings.
function runState(run){
  if(!run||!run.at)return "never";
  if(run.status==="error")return "error";
  var h=hoursSince(run.at);
  var limit=Number(state.settings&&state.settings.stale_run_hours)||36;
  return (h===null||h>limit)?"stale":"ok";
}

// Coarse on purpose - the useful distinctions are "today", "yesterday", and
// "long enough ago that something is wrong", not exact minutes.
function relWhen(iso){
  var h=hoursSince(iso);
  if(h===null)return "";
  if(h<1)return "just now";
  if(h<24)return Math.round(h)+"h ago";
  var d=Math.floor(h/24);
  return d===1?"yesterday":d+"d ago";
}

// Counts come from the run record, not leads[], so a day that added nothing
// still reads as a result.
function runSummary(run){
  if(!run||!run.at)return "";
  if(run.status==="error")return run.note||"the run reported an error";
  var bits=[];
  if(run.leads_added)bits.push(run.leads_added+" new");
  if(run.screened_added)bits.push(run.screened_added+" screened out");
  // Counted on the run; the taken-down leads themselves are deleted.
  if(run.delisted)bits.push(run.delisted+" taken down");
  return bits.length?bits.join(", "):"found nothing new";
}

// Rule shape: priority_locations in server/migrations/0001_schema.sql.
function geo(location){
  var loc=String(location||"").toLowerCase();
  var rules=(state.settings&&state.settings.priority_locations)||[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    if(r.allOf&&!r.allOf.every(function(s){return loc.indexOf(s)>=0;}))continue;
    if(r.anyOf&&!r.anyOf.some(function(s){return loc.indexOf(s)>=0;}))continue;
    return {p:priClass(i),label:r.label,i:i};
  }
  return null;
}
// Priority is the rule's position in priority_locations, not its `tier`
// string, so any number of rankings works. `tier` is ignored.
function priClass(i){return i<5?"pri"+i:"";}
function rank(l){var g=geo(l.location);return g?g.i:999;}

// The password is sent once for a session token and never stored. The name
// is remembered, since it isn't a secret.
function submitToken(){
  if(!API_BASE){
    document.getElementById("gateError").textContent="This deployment has no API URL configured - see public/local-config.example.js.";
    return;
  }
  var name=document.getElementById("nameInput").value.trim();
  var password=document.getElementById("passwordInput").value;
  if(!name||!password){
    document.getElementById("gateError").textContent="Enter your name and password.";
    return;
  }
  document.getElementById("gateError").textContent="Signing in...";
  fetch(API_BASE+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:name,password:password,label:"browser"})
  }).then(function(res){
    return res.json().then(function(body){return {status:res.status,body:body};});
  }).then(function(r){
    if(r.status!==200||!r.body.token){
      document.getElementById("gateError").textContent="That name and password don't match.";
      return;
    }
    TOKEN=r.body.token;
    NAME=r.body.user&&r.body.user.name||name;
    try{localStorage.setItem("tracker_token",TOKEN);localStorage.setItem("tracker_name",NAME);}catch(e){}
    document.getElementById("passwordInput").value="";
    document.getElementById("gateError").textContent="";
    boot();
  }).catch(function(err){
    document.getElementById("gateError").textContent="Couldn't sign in: "+err.message;
  });
}

// Changing your own password.
//
// The fields are cleared on every exit, cancel included, so a mistyped
// attempt doesn't leave a password sitting in the DOM.
function openPwModal(){
  ["pwCurrent","pwNew","pwConfirm"].forEach(function(id){document.getElementById(id).value="";});
  document.getElementById("pwSignOut").checked=true;
  setPwMsg("");
  document.getElementById("pwModal").classList.remove("hidden");
  document.getElementById("pwCurrent").focus();
}

function closePwModal(){
  ["pwCurrent","pwNew","pwConfirm"].forEach(function(id){document.getElementById(id).value="";});
  setPwMsg("");
  document.getElementById("pwModal").classList.add("hidden");
}

function setPwMsg(text,kind){
  var el=document.getElementById("pwMsg");
  el.className="pw-msg"+(kind?" "+kind:"");
  el.textContent=text||"";
}

function submitPwChange(){
  var current=document.getElementById("pwCurrent").value;
  var next=document.getElementById("pwNew").value;
  var confirm=document.getElementById("pwConfirm").value;
  var signOut=document.getElementById("pwSignOut").checked;
  var save=document.getElementById("pwSave");

  // Checked here as well as on the server, so the common typos answer
  // instantly and without sending the password anywhere.
  if(!current){setPwMsg("Enter your current password.","bad");return;}
  if(next.length<12){setPwMsg("Your new password needs to be at least 12 characters.","bad");return;}
  if(next!==confirm){setPwMsg("Those two new passwords don\u2019t match.","bad");return;}

  save.disabled=true;
  setPwMsg("Changing...");
  api("/api/password",{method:"POST",body:JSON.stringify({
    currentPassword:current,newPassword:next,signOutOthers:signOut
  })}).then(function(r){
    save.disabled=false;
    if(r&&r.error){setPwMsg(r.error,"bad");return;}
    // Confirmed out loud: the count is the only evidence the checkbox did
    // anything.
    var note="Password changed.";
    if(signOut){
      note+=r.signedOut===1?" One other browser was signed out."
           :r.signedOut>0?" "+r.signedOut+" other browsers were signed out."
           :" No other browsers were signed in.";
    }
    setPwMsg(note,"good");
    ["pwCurrent","pwNew","pwConfirm"].forEach(function(id){document.getElementById(id).value="";});
    setTimeout(function(){
      if(!document.getElementById("pwModal").classList.contains("hidden"))closePwModal();
    },2200);
  }).catch(function(err){
    save.disabled=false;
    // api() has already forgotten the session and shown the gate in this case;
    // saying anything here would be writing into a hidden dialog.
    if(err.message==="unauthorized")return;
    setPwMsg("Couldn\u2019t change it: "+err.message,"bad");
  });
}

// View preferences go too: they're per-person, and leaving them would land
// the next person on a tab that isn't theirs.
function forgetSession(message){
  TOKEN="";
  try{
    localStorage.removeItem("tracker_token");
    localStorage.removeItem("bjs.tab");
    localStorage.removeItem("bjs.view");
    localStorage.removeItem("bjs.leadSort");
    localStorage.removeItem("bjs.appSort");
  }catch(e){}
  // The in-memory copy too: signing in as someone else doesn't reload the
  // page, and the old values would be re-saved under the new session.
  ui.tab="dashboard";ui.q="";ui.filter="All";ui.selected={};ui.expanded={};
  ui.view="detail";ui.leadSort="priority";ui.appSort="applied-desc";ui.drill=null;
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("gateError").textContent=message||"";
  var pw=document.getElementById("passwordInput");
  if(pw){pw.value="";pw.focus();}
}

// Revokes the token server-side too, so signing out of a shared browser
// invalidates it. This person's other sessions, like the scheduled search's,
// are untouched.
function logout(){
  var token=TOKEN;
  forgetSession("");
  if(!token||!API_BASE)return;
  // Forgetting locally must not depend on the network, but an unrevoked token
  // matters on a shared machine, so say so.
  fetch(API_BASE+"/api/logout",{method:"POST",headers:{"Authorization":"Bearer "+token}}).then(function(res){
    if(!res.ok)throw new Error("status "+res.status);
  }).catch(function(){
    document.getElementById("gateError").textContent=
      "Signed out here, but couldn't reach the server to revoke this session.";
  });
}

function api(path,opts){
  var headers={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};
  if(opts&&opts.headers){for(var k in opts.headers){headers[k]=opts.headers[k];}}
  var merged={};
  if(opts){for(var k2 in opts){merged[k2]=opts[k2];}}
  merged.headers=headers;
  return fetch(API_BASE+path,merged).then(function(res){
    if(res.status===401){
      // Revoked elsewhere or never valid; either way, sign in again.
      forgetSession("Your session has expired - sign in again.");
      throw new Error("unauthorized");
    }
    return res.json();
  });
}

function boot(){
  setSaved("Loading",false);
  api("/api/data").then(function(data){
    state=data;
    if(!state.leads)state.leads=[];
    if(!state.applications)state.applications=[];
    if(!Array.isArray(state.tracks))state.tracks=[];
    var d=defaultSettings();
    if(!state.settings)state.settings=d;
    else for(var sk in d){if(state.settings[sk]==null)state.settings[sk]=d[sk];}
    applyConfig();
    if(state.user&&state.user.name){
      NAME=state.user.name;
      try{localStorage.setItem("tracker_name",NAME);}catch(err2){}
    }
    document.getElementById("whoami").textContent=NAME?"Signed in as "+NAME:"";
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    setSaved("Saved",true);
    render();
  }).catch(function(err){
    var el=document.getElementById("gateError");
    if(el&&err.message!=="unauthorized")el.textContent="Couldn't load: "+err.message;
  });
}

          ? '<button type="button" class="jumplink" data-tab="applications" data-drill="'+esc(r[2])+'" '+
            'title="Open these in Applications">'+esc(r[0])+'</button>'
          : '<span class="jumpdead" title="Nothing has reached this stage yet">'+esc(r[0])+'</span>';
        return '<div class="bar"><h3>'+head+' <span>'+r[1]+' &middot; '+pct+'%</span></h3>'+
          '<div class="meter"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
      }).join("")+'</div>';

    // "Responded" counts a rejection (a response, just not a forward one), so
    // it's larger than the funnel's stages. Withdrawn is excluded: it's your
    // action, not the company's.
    var RESPONSE_FIELDS=["dateRecruiterScreen","dateTechScreen","dateOnsite","dateOffer","dateRejected"];
    var responded=appliedRows.filter(function(a){
      return RESPONSE_FIELDS.some(function(f){return a[f];});
    }).length;
    var respTimes=appliedRows.map(function(a){
      if(!a.dateApplied)return null;
      var d0=Date.parse(a.dateApplied); if(isNaN(d0))return null;
      var earliest=null;
      RESPONSE_FIELDS.forEach(function(f){
        if(!a[f])return;
        var d=Date.parse(a[f]); if(isNaN(d))return;
        if(earliest===null||d<earliest)earliest=d;
      });
      if(earliest===null)return null;
      var days=Math.round((earliest-d0)/86400000);
      return days>=0?days:null;
    }).filter(function(n){return n!==null;});
    var avgResp=respTimes.length?Math.round(respTimes.reduce(function(a,b){return a+b;},0)/respTimes.length):null;
    var offerNow=appliedRows.filter(function(a){return a.status==="Offer";}).length;
    var rejectedNow=appliedRows.filter(function(a){return a.status==="Rejected";}).length;
    var withdrawnNow=appliedRows.filter(function(a){return a.status==="Withdrawn";}).length;
    h+='<div class="legend" style="margin-top:15px;padding-top:14px;border-top:1px solid var(--line)">'+
      '<span><b style="background:var(--good)"></b>'+offerNow+' offer'+(offerNow===1?'':'s')+'</span>'+
      '<span><b style="background:var(--crit)"></b>'+rejectedNow+' rejected</span>'+
      '<span><b style="background:var(--ink3)"></b>'+withdrawnNow+' withdrawn</span>'+
      '<span class="legend-run">'+Math.round(responded/appliedCount*100)+'% responded'+
      (avgResp!==null?' &middot; avg '+avgResp+'d to first response':'')+'</span>'+
      '</div></div>';
  }

  h+='<div class="note">'+(trackCount
    ? 'Scheduled searches across your '+trackCount+' tracked search'+(trackCount===1?'':'es')+' add rows here every day.'
    : 'Once a tracked search is set up, its scheduled run adds rows here every day.')+
    ' Every posting is opened and confirmed live before it lands; nothing arrives from a search snippet alone.</div>';
  h+='</div>'; // .panel-scroll
  return h;
}

function leadsTab(key){
  // Also draws the pooled tab (key===ALL_LEADS), skipping what only a single
  // track has: its description, run stamp and empty-state explanations.
  // `tracked` keeps Applied leads so the empty state can tell "never found
  // anything" from "everything was applied to".
  var isAll=(key===ALL_LEADS);
  var scopeLabel=isAll
    ? ((state.settings&&state.settings.all_leads_label)||"All leads")
    : TRACKS[key].label;
  var tracked=state.leads.filter(function(l){return isAll||l.search===key;});
  var all=leadRows(key);
  var q=ui.q.toLowerCase();
  var rows=all.filter(function(l){
    if(ui.filter!=="All"&&l.status!==ui.filter)return false;
    if(!drillKeeps("leads",l))return false;
    if(!q)return true;
    return (l.company+" "+l.title+" "+l.location).toLowerCase().indexOf(q)>=0;
  }).sort(leadComparator(ui.leadSort));
  var h='<div class="toolbar">'+
    '<div class="search"><input type="search" id="q" placeholder="Filter '+esc(scopeLabel)+'&hellip;" value="'+esc(ui.q)+'"></div>'+
    '<div class="chips">'+["All"].concat(LEAD_STATUS.filter(function(s){return s!=="Applied";})).map(function(f){
      return '<button class="chip" data-filter="'+esc(f)+'" aria-pressed="'+(ui.filter===f)+'">'+esc(f)+'</button>';
    }).join("")+drillChipHtml("leads")+'</div>'+
    viewSwitchHtml()+'</div>'+
    '<div class="key"><div class="sortwrap"><label class="sort-label" for="leadSort">Sort</label>'+sortSelectHtml("leads","leadSort")+'</div>'+
      geoKeyHtml()+
      // Only the default sort orders by proximity.
      (ui.leadSort==="priority"?'<span>Closest roles sorted first</span>':'')+
      // A pooled list has no single run behind it, so it says how many
      // searches feed it instead of which one last reported.
      '<span class="key-run">'+(isAll
        ? esc(trackCountLine())
        : runStampHtml(key))+'</span></div>';

  if(!all.length&&isAll){
    return h+'<div class="card empty"><strong>Nothing open right now</strong>'+
      'No tracked search has a posting waiting to be looked at &mdash; everything found so far has been '+
      'applied to or ruled out. New postings land here as the daily runs find them.</div>';
  }
  if(!all.length){
    // `tracked` separates "found nothing" from "all applied to"; the run
    // record separates a real zero from a search that stopped running. A track
    // whose postings were all taken down reads as "found nothing" - the server
    // deletes delisted leads (removeDelistedLead in server/src/routes/delisting.js).
    var st0=runState(TRACKS[key].run);
    var warn0=(st0==="stale"||st0==="error")
      ? '<div class="empty-warn">But this search hasn&rsquo;t reported a clean run recently &mdash; check the scheduled task before reading this as a genuine zero.</div>'
      : '';
    if(tracked.length){
      return h+'<div class="card empty"><strong>Nothing open right now</strong>'+
        'Everything this search is still tracking has been applied to &mdash; it&rsquo;s all in the Applications tab. '+
        'New postings land here as the daily run finds them.'+warn0+'</div>';
    }
    return h+'<div class="card empty"><strong>No postings yet</strong>The '+esc(TRACKS[key].label).toLowerCase()+
      ' search hasn&rsquo;t turned up a verified opening yet. An empty day is a real result &mdash; nothing gets padded in here.'+
      warn0+'</div>';
  }
  if(!rows.length) return h+'<div class="card empty"><strong>Nothing matches</strong>Try a different filter.</div>';
  // The pooled list's tab doesn't say which search found a row, so tag each one.
  function trackTagHtml(l){
    if(!isAll)return "";
    var tr=TRACKS[l.search];
    return '<span class="md-row-track">'+esc(tr?tr.label:l.search)+'</span>';
  }

  if(ui.view==="grid"){
    h+=leadsGridHtml(rows,key,isAll);
    h+='<div class="note">Quick-scan columns only &mdash; referral, notes, team, setup, and the rest are in Detail view (click a row to open them). Edits save when you click away. '+rows.length+' of '+all.length+' shown.</div>';
    return h;
  }

  var sel=rows.filter(function(l){return String(l.id)===String(ui.selected[key]);})[0]||rows[0];
  ui.selected[key]=sel.id;

  var listHtml=rows.map(function(l){
    var g=geo(l.location);
    var cls="md-row"+(l.id===sel.id?" sel":"")+(g?" "+g.p:"");
    return '<div class="'+cls+'" data-select="'+l.id+'" data-scope="'+key+'">'+
      '<div class="md-row-top"><span class="co">'+esc(l.company)+'</span>'+
        '<span class="pill '+pillFor(l.status)+'">'+esc(l.status)+'</span></div>'+
      '<div class="md-row-ttl">'+esc(l.title)+trackTagHtml(l)+'</div>'+
      '<div class="md-row-loc"><span class="md-row-place">'+esc(l.location)+'</span>'+
        (g?'<span class="geo '+g.p+'">'+esc(g.label)+'</span>':'')+
        '<span class="md-row-found" title="Date this listing was added">Found <span class="mono">'+esc(l.found)+'</span></span></div>'+
    '</div>';
  }).join("");

  h+='<div class="md"><div class="md-list">'+listHtml+'</div><div class="md-detail">'+leadDetailHtml(sel,isAll?sel.search:key)+'</div></div>';
  h+='<div class="note">Status, notes, and details save when you click away from the field. '+rows.length+' of '+all.length+' shown.</div>';
  return h;
}

// Grid view is a scroll-free scan, so it shows few columns; Detail view has

  '</tr></thead><tbody>'+rows.map(function(l){
    var g=geo(l.location);

    var row='<tr data-expand="'+l.id+'" data-scope="'+trackKey+'"'+(cls?' class="'+cls+'"':'')+'>'+
      '<td class="co cc" title="'+esc(l.company)+'">'+esc(l.company)+'</td>'+
      '<td class="rc"><a href="'+esc(l.url)+'" target="_blank" rel="noopener" title="'+esc(l.title)+'">'+esc(l.title)+'</a></td>'+
      // The tier is the row's left stripe, not a badge: a grid is scanned down
      // a column, and the ranking said twice is one more thing to read past.
      '<td class="loc" title="'+esc(l.location)+'"><div class="loc-txt">'+esc(l.location)+'</div></td>'+
      '<td>'+selectHtml(LEAD_STATUS,l.status,'data-id="'+l.id+'" data-field="status"')+'</td>'+

        var key=f[0],val=l[key]||"";
        return '<td><input type="text" data-id="'+l.id+'" data-field="'+key+'" value="'+esc(val)+'"></td>';
      }).join("")+
      (isAll?'<td class="cc" title="'+esc(TRACKS[l.search]?TRACKS[l.search].label:l.search)+'">'+
        esc(TRACKS[l.search]?TRACKS[l.search].label:l.search)+'</td>':'')+
      '<td class="dt mono">'+esc(l.found)+'</td>'+

// Options carry track keys, not labels, so shared labels and renames still
// move correctly. With one track there is nowhere to move to, so it's a label.
function leadTrackHtml(l,key){
  var keys=Object.keys(TRACKS);
  if(keys.length<2)return '<div class="dh-track">'+esc(TRACKS[key].label)+'</div>';
  return '<select class="dh-track-in" data-movelead="'+l.id+'" '+
    'title="Move this posting to another tab" aria-label="Tab">'+
    keys.map(function(k){
      return '<option value="'+esc(k)+'"'+(k===key?" selected":"")+'>'+esc(TRACKS[k].label)+'</option>';
    }).join("")+'</select>';
}

function appsTab(){

  // Adding takes a pasted posting URL; the nightly fill reads company, role and

    '<div class="search"><input type="url" id="appurl"'+
      ' placeholder="Paste a link straight to the job posting"'+
      ' aria-label="Link to a job posting" aria-describedby="addhint"'+
      // "Straight to" is the constraint: the run opens exactly this URL, so a
      // search page or a careers index produces a row nothing can fill.
      ' title="The posting&rsquo;s own page, not a search or a careers index &mdash; that page is what tonight&rsquo;s run opens and reads. Greenhouse, Lever, Workday and company careers pages all work."></div>'+
    // Never disabled: a row with no posting is a real use. syncAddControl()
    // relabels it, and gives it primary weight, once the field has a URL.
    '<button class="btn" id="addapp">Add empty row</button>'+
    '<span class="hint" id="addhint">Adds a row for you to fill in yourself.</span>'+
    viewSwitchHtml()+'</div>'+
    '<div class="key"><div class="sortwrap"><label class="sort-label" for="appSort">Sort</label>'+sortSelectHtml("applications","appSort")+'</div>'+
      // Rows here carry the tier stripe, which means nothing without the legend.
      geoKeyHtml()+
      (drillChipHtml("apps")?'<div class="chips">'+drillChipHtml("apps")+'</div>':'')+'</div>';
  if(!ALL_APPS.length){
    return h+'<div class="card empty"><strong>No applications logged</strong>'+
      'When you apply to something, add it here to track the conversation. Days-since updates itself.</div>';
  }
  if(!A.length){
    return h+'<div class="card empty"><strong>Nothing matches</strong>'+
      'No application matches this filter. Clear it above to see all '+ALL_APPS.length+'.</div>';
  }

  if(ui.view==="grid"){
    h+=appsGridHtml(A);
    h+='<div class="note">Quick-scan columns only &mdash; referral, notes, team, setup, comp, and the rest are in Detail view (click a row to open them). Edits save when you click away. Days counts from the applied date.</div>';
    return h;
  }

  var sel=A.filter(function(a){return String(a.id)===String(ui.selected.applications);})[0]||A[0];
  ui.selected.applications=sel.id;

  var listHtml=A.map(function(a){
    var d=daysSince(a.dateApplied);
    var g=geo(a.location);
    var cls="md-row"+(a.id===sel.id?" sel":"")+(g?" "+g.p:"");
    return '<div class="'+cls+'" data-select="'+a.id+'" data-scope="applications">'+
      '<div class="md-row-top"><span class="co">'+esc(a.company||hostOf(a.link)||"Untitled")+'</span>'+
        '<span class="pill '+pillFor(a.status)+'">'+esc(a.status)+'</span></div>'+
      // The dash is markup, so it stays outside esc(). An unreadable posting

      '<div class="md-row-ttl">'+(a.title?esc(a.title)
        :(a.autofill==="failed"?'Couldn&rsquo;t read the posting':"&mdash;"))+'</div>'+

  h+='<div class="md"><div class="md-list">'+listHtml+'</div><div class="md-detail">'+appDetailHtml(sel)+'</div></div>';
