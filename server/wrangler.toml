name = "jobsearch-cloud"
main = "src/index.js"
compatibility_date = "2025-01-01"

# API-only worker - no page-serving, so no text-import rule needed (the
# client at ../client/ is a separate deployable, see its own wrangler.toml).

# Created by: wrangler d1 create jobsearch-cloud-db
# Paste the database_id it prints below.
#
# Deliberately blank, and it stays blank until this deployment has a database
# of its own. This repo is a mirror of the personal tracker, so it arrived
# carrying that tracker's live database_id - and `npm run deploy` here starts
# with `wrangler d1 migrations apply DB --remote`, which resolves its target
# from this line and nothing else. Renaming the worker above is no protection:
# a differently-named worker pointed at the old id still migrates the real
# users' data. Empty fails the deploy immediately, which is the point.
[[d1_databases]]
binding = "DB"
database_name = "jobsearch-cloud-db"
database_id = ""
migrations_dir = "./migrations"
