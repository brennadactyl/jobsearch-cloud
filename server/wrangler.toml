name = "job-search-tracker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# API-only worker - no page-serving, so no text-import rule needed (the
# client at ../client/ is a separate deployable, see its own wrangler.toml).

# Created by: wrangler d1 create job-search-tracker-db
# Paste the database_id it prints below.
#
# This is the live tracker's worker and the live tracker's database, and that
# is deliberate: this repo took over the running deployment rather than
# standing up a second one beside it. The names are load-bearing for that.
# `wrangler deploy` does not rename a worker - a changed `name` publishes a
# NEW worker on a NEW URL and leaves the old one serving, which would strand
# every bookmark, the client's local-config.js, and the scheduled runner on
# the old origin while this repo talked to an empty copy.
#
# What that costs: `npm run deploy` from here runs
# `wrangler d1 migrations apply DB --remote` against real users' data, and the
# block-remote-d1-writes hook deliberately allows migrations. So an unfinished
# migration in this tree is one deploy away from production. That is the price
# of the productization work living in the same repo that owns the deployment.
# Verify with verify-migration.mjs and take a `wrangler d1 export` first.
[[d1_databases]]
binding = "DB"
database_name = "job-search-tracker-db"
database_id = "104f139f-bc84-4e72-8034-8541ef563ae4"
migrations_dir = "./migrations"
