name = "job-search-tracker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# API-only worker - no page-serving, so no text-import rule needed (the
# client at ../client/ is a separate deployable, see its own wrangler.toml).

# Created by: wrangler d1 create job-search-tracker-db
#
# Never change `name`: `wrangler deploy` does not rename a worker, it publishes
# a new one on a new URL and leaves the old one serving, stranding every
# bookmark, the client's local-config.js and the scheduled runner on it.
#
# `npm run deploy` applies pending migrations to production. Run
# verify-migration.mjs and take a backup first (add-d1-migration skill).
[[d1_databases]]
binding = "DB"
database_name = "job-search-tracker-db"
database_id = "104f139f-bc84-4e72-8034-8541ef563ae4"
migrations_dir = "./migrations"

# Resumes and the per-track baseline docs the nightly run reads and edits
# (src/r2.js).
#
# Created by: wrangler r2 bucket create job-search-tracker-docs
#
# No D1 table: an object's key is <user-id>/<relative path>, and R2's list()
# returns the size, etag, upload time and content type a table would duplicate.
#
# `wrangler d1 export` does not cover this bucket; scripts/backup-tracker.ps1
# backs it up.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "job-search-tracker-docs"
