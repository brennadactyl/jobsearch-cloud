<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-label="Windows Task Scheduler runs one headless Claude run per track, plus a nightly application fill. Each run fetches its prompt and documents from the server/ API Worker into a throwaway folder, searches and verifies career sites, reports through ./tracker, and writes back the doc it edited. The API keeps rows in D1 and documents in R2 and answers the browser's cross-origin calls; client/, a separate static-assets Worker, serves the tracker page.">
  <rect x="0" y="0" width="1440" height="440" fill="#FAFAF7" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D2027" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4548D6" />
    </marker>
  </defs>

  <!-- ===== connectors (drawn first, under boxes) ===== -->
  <g fill="none" stroke="#1D2027" stroke-width="1.6" opacity="0.85">
    <!-- Task Scheduler -> headless run -->
    <line x1="190" y1="100" x2="190" y2="150" marker-end="url(#arrow)" />
    <!-- headless run <-> this machine -->
    <line x1="190" y1="260" x2="190" y2="310" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <!-- headless run -> career sites (elbow) -->
    <polyline points="340,160 450,160 450,60 560,60" marker-end="url(#arrow)" />
    <!-- server/ <-> D1 -->
    <line x1="620" y1="260" x2="620" y2="310" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <!-- server/ <-> R2 -->
    <line x1="800" y1="260" x2="800" y2="310" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <!-- client/ -> browser (serves the page) -->
    <line x1="1250" y1="310" x2="1250" y2="260" marker-end="url(#arrow)" />
  </g>
  <g fill="none" stroke="#4548D6" stroke-width="2">
    <!-- headless run <-> server/: ./tracker -->
    <line x1="340" y1="208" x2="560" y2="208" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccent)" />
    <!-- run-search.ps1 <-> server/: prompt and documents -->
    <line x1="340" y1="240" x2="560" y2="240" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccent)" />
    <!-- server/ <-> browser: cross-origin API calls -->
    <line x1="860" y1="210" x2="1100" y2="210" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccent)" />
  </g>

  <!-- ===== connector labels ===== -->
  <g font-family="'Space Mono', monospace" font-size="11.5" fill="#1D2027">
    <text x="204" y="129">fires daily</text>
    <text x="204" y="289">logs, run folder</text>
    <text x="458" y="120">WebSearch + WebFetch</text>
    <text x="458" y="136" opacity="0.7">verify every URL</text>
    <text x="606" y="289" text-anchor="end">SQL</text>
    <text x="814" y="289">documents</text>
    <text x="1264" y="289">serves the page</text>
  </g>
  <g font-family="'Space Mono', monospace" font-size="11.5" fill="#4548D6">
    <text x="354" y="180">./tracker leads, screened,</text>
    <text x="354" y="195">verified, delist, swept, run</text>
    <text x="354" y="258">GET prompt + documents</text>
    <text x="354" y="273" opacity="0.75">PUT the doc it edited</text>
    <text x="874" y="186">fetch /api/data, /api/update, …</text>
    <text x="874" y="200" opacity="0.75">CORS + session token</text>
  </g>

  <!-- ===== boxes ===== -->
  <!-- Task Scheduler -->
  <g>
    <rect x="40" y="20" width="300" height="80" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="60" y="47" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">Windows Task Scheduler</text>
    <text x="60" y="68" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.7">run-search.ps1 — one per track</text>
    <text x="60" y="85" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.7">run-fill.ps1 — 06:30, every account</text>
  </g>

  <!-- Headless run -->
  <g>
    <rect x="40" y="150" width="300" height="110" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="60" y="177" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">Headless run</text>
    <text x="60" y="197" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.7">run-search.ps1 → claude -p</text>
    <text x="60" y="214" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">Read Write Edit Glob Grep</text>
    <text x="60" y="229" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">WebSearch WebFetch Bash — fixed list</text>
    <text x="60" y="248" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.7">./tracker — the API as commands</text>
  </g>

  <!-- This machine -->
  <g>
    <rect x="40" y="310" width="300" height="110" rx="9" fill="#F7ECDA" stroke="#A9660E" stroke-width="1.4" />
    <text x="60" y="337" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#A9660E">This machine — local only</text>
    <text x="60" y="357" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.75">&lt;DataDir&gt;\&lt;user-id&gt;\</text>
    <text x="60" y="374" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.75">tracker.json — tracker URL + token</text>
    <text x="60" y="389" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.75">logs\ and .run\&lt;track&gt;\ — one run's docs</text>
    <text x="60" y="404" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.75">gitignored — never committed</text>
  </g>

  <!-- Career sites -->
  <g>
    <rect x="560" y="20" width="300" height="80" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="580" y="47" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">Career sites</text>
    <text x="580" y="68" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">Greenhouse, Ashby, Workday boards</text>
    <text x="580" y="85" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">and company careers pages</text>
  </g>

  <!-- server/ (API only) -->
  <g>
    <rect x="560" y="150" width="300" height="110" rx="9" fill="#E9E9FB" stroke="#4548D6" stroke-width="1.6" />
    <text x="580" y="177" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#4548D6">server/ — API Worker</text>
    <text x="580" y="197" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.75">job-search-tracker</text>
    <text x="580" y="216" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">JSON only, no page — CORS-enabled</text>
    <text x="580" y="231" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">composes each run's prompt</text>
    <text x="580" y="246" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">each request scoped to its caller</text>
  </g>

  <!-- D1 -->
  <g>
    <rect x="460" y="310" width="240" height="110" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="480" y="337" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">D1 database</text>
    <text x="480" y="357" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.75">job-search-tracker-db</text>
    <text x="480" y="376" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">tables: docs/schema.md</text>
    <text x="480" y="391" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">one row per posting — no</text>
    <text x="480" y="406" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">shared blob to race</text>
  </g>

  <!-- R2 -->
  <g>
    <rect x="720" y="310" width="240" height="110" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="740" y="337" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">R2 bucket</text>
    <text x="740" y="357" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.75">job-search-tracker-docs</text>
    <text x="740" y="376" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">resumes, baseline docs</text>
    <text x="740" y="391" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">stored as &lt;user-id&gt;/&lt;path&gt;</text>
    <text x="740" y="406" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">read + written via /api/documents</text>
  </g>

  <!-- Browser -->
  <g>
    <rect x="1100" y="150" width="300" height="110" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="1120" y="177" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">Browser</text>
    <text x="1120" y="197" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">view and edit leads, applications</text>
    <text x="1120" y="212" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">sign in with name + password</text>
    <text x="1120" y="246" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.65">session token in localStorage</text>
  </g>

  <!-- client/ (static Worker) -->
  <g>
    <rect x="1100" y="310" width="300" height="110" rx="9" fill="#FFFFFF" stroke="#C3C5CE" stroke-width="1.3" />
    <text x="1120" y="337" font-family="'Archivo', sans-serif" font-weight="700" font-size="15" fill="#1D2027">client/ — static Worker</text>
    <text x="1120" y="357" font-family="'Space Mono', monospace" font-size="11" fill="#1D2027" opacity="0.75">job-search-tracker-client</text>
    <text x="1120" y="376" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">one HTML file, no build step</text>
    <text x="1120" y="391" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">API URL from local-config.js</text>
    <text x="1120" y="406" font-family="'Source Sans 3', sans-serif" font-size="12" fill="#1D2027" opacity="0.65">client-react/ beside it, unfinished</text>
  </g>

</svg>
